<!-- Display GoatCounter site-wide total -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('site-total-views');

    if (el !== null) {
      const url = `https://{{ site.analytics.goatcounter.id }}.goatcounter.com/counter/TOTAL.json`;

      fetch(url)
        .then((response) => response.json())
        .then((data) => {
          const count = data.count.replace(/\D/g, '');
          el.innerText = new Intl.NumberFormat().format(count);
        })
        .catch((error) => {
          el.innerText = '—';
        });
    }
  });
</script>
