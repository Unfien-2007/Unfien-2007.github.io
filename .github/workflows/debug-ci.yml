name: Debug CI

on:
  push:
    paths-ignore:
      - ".github/debug-logs/**"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Node deps
        run: npm i

      - name: Build Assets
        run: npm run build || true

      - name: Lint SCSS (capture)
        run: |
          mkdir -p .github/debug-logs
          npm run lint:scss > .github/debug-logs/lint-scss.log 2>&1 || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Jekyll build (capture)
        run: |
          rm -rf _site
          JEKYLL_ENV=production bundle exec jekyll b -d _site -c _config.yml > .github/debug-logs/jekyll-build.log 2>&1 || true

      - name: Htmlproofer (capture)
        run: |
          if [ -d _site ]; then
            bundle exec htmlproofer _site --disable-external --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/" > .github/debug-logs/htmlproofer.log 2>&1 || true
          else
            echo "_site missing" > .github/debug-logs/htmlproofer.log
          fi

      - name: Commit logs back to repo
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add .github/debug-logs
          if git diff --cached --quiet; then
            echo "no logs captured"
            exit 0
          fi
          git commit -m "chore(ci): capture debug logs"
          git push origin HEAD:master
