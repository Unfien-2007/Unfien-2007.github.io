name: Debug CI

on:
  push:
    paths-ignore:
      - ".github/debug-logs/**"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Node deps
        run: npm i

      - name: Lint SCSS (capture)
        run: |
          mkdir -p .github/debug-logs
          npm run lint:scss > .github/debug-logs/lint-scss.log 2>&1 || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Test Site (capture)
        run: bash tools/test.sh > .github/debug-logs/ci.log 2>&1 || true

      - name: Commit logs back to repo
        run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add .github/debug-logs
          if git diff --cached --quiet; then
            echo "no logs captured"
            exit 0
          fi
          git commit -m "chore(ci): capture debug logs"
          git push origin HEAD:master
